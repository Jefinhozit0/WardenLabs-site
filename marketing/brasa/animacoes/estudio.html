<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Brasa · estúdio de animações</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@300;400;500;600;700;800&display=block">
  <style>
    :root { --bg: #0d1013; --ink: #eef2f4; --muted: #a3afb8; --amber: #f5b042; --amber-2: #ffc566; --line: #2c353d; --card: #1d242b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #050607; overflow: hidden; }
    body { font-family: Manrope, system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }

    /* O palco tem sempre 1080×1920; na prévia ele é reduzido para caber na janela */
    #palco { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: var(--bg); overflow: hidden; transform-origin: 0 0; }
    #palco canvas { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
    #sombra { position: absolute; inset: 0; pointer-events: none; background:
      radial-gradient(120% 70% at 50% 62%, rgba(13,16,19,0) 45%, rgba(7,9,11,.78) 100%),
      linear-gradient(180deg, rgba(13,16,19,.72) 0%, rgba(13,16,19,0) 36%); }
    #textos { position: absolute; inset: 0; }

    .bloco { position: absolute; left: 80px; right: 80px; top: 250px; text-align: center; will-change: opacity, transform; }
    .item { will-change: opacity, transform; }
    .mono { font-family: "JetBrains Mono", monospace; font-size: 27px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); display: inline-flex; align-items: center; gap: 16px; }
    .mono i { width: 12px; height: 12px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 18px var(--amber); }
    h1 { font-size: 112px; line-height: 1.02; font-weight: 800; letter-spacing: -.035em; margin-top: 34px; }
    h1.menor { font-size: 92px; }
    h1 em { font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 500; letter-spacing: -.01em; color: var(--amber-2); font-size: 1.12em; }
    .lead { font-size: 42px; line-height: 1.32; font-weight: 400; color: var(--muted); margin: 36px auto 0; max-width: 820px; }
    .apagado h1 { color: #8f9ba4; }
    .apagado h1 em { color: #b9c3ca; }

    .cartoes { display: grid; gap: 18px; margin-top: 50px; }
    .cartao { display: grid; grid-template-columns: 92px 1fr; align-items: center; text-align: left; padding: 26px 36px; border-radius: 28px; background: rgba(29,36,43,.92); box-shadow: inset 0 0 0 2px var(--line); }
    .cartao .n { font-family: "JetBrains Mono", monospace; font-size: 30px; color: var(--amber); }
    .cartao b { display: block; font-size: 52px; font-weight: 800; letter-spacing: -.02em; }
    .cartao span { display: block; font-size: 32px; color: var(--muted); margin-top: 4px; }

    .selos { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; margin-top: 50px; }
    .selo { display: inline-flex; align-items: center; gap: 14px; font-size: 40px; font-weight: 700; padding: 20px 34px; border-radius: 99px; background: rgba(29,36,43,.92); box-shadow: inset 0 0 0 2px #3b4750; }
    .selo svg { width: 36px; height: 36px; stroke: var(--amber); }

    .marca { top: 240px; }
    .marca .w { width: 190px; height: 134px; }
    .marca .nome { font-size: 118px; letter-spacing: -.04em; line-height: 1; margin-top: 26px; }
    .marca .nome b { font-weight: 800; }
    .marca .nome span { font-weight: 300; color: var(--muted); }
    .marca .mono { margin-top: 30px; }
    .marca .site { display: inline-block; margin-top: 46px; font-size: 40px; font-weight: 700; color: #0d1013; background: var(--amber); padding: 20px 40px; border-radius: 99px; }

    /* Só na prévia */
    #menu { position: fixed; right: 16px; top: 16px; display: grid; gap: 8px; font: 500 13px/1 Manrope, sans-serif; z-index: 5; }
    #menu a { color: var(--ink); text-decoration: none; padding: 9px 14px; border-radius: 99px; background: #1d242b; }
    #menu a[aria-current] { background: var(--amber); color: #0d1013; }
    .render #menu { display: none; }
  </style>
</head>
<body>
  <div id="palco">
    <div id="sombra"></div>
    <div id="textos"></div>
  </div>
  <nav id="menu" aria-label="Clipes"></nav>
  <script type="module" src="./estudio.js"></script>
</body>
</html>
